name: iPhone Duo 256GB Tracker

on:
  workflow_dispatch:

# Verhindert parallele Läufe (z. B. doppelter Trigger von cron-job.org)
concurrency:
  group: iphone-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: State wiederherstellen
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: tracker-state-${{ github.run_id }}
          restore-keys: tracker-state-

      - name: Bibliotheken installieren
        run: pip install requests beautifulsoup4

      - name: Tracker ausführen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tracker.py

      - name: State speichern
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: tracker-state-${{ github.run_id }}-${{ github.run_attempt }}
