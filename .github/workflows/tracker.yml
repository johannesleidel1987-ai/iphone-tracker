name: iPhone Duo 256GB Tracker

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Test-Push bei manuellem Start senden
        if: github.event_name == 'workflow_dispatch'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="✅ Verbindung steht! Dein iPhone Duo Tracker (256 GB Sternenweiß ≤ 2.400 €) läuft jetzt auf GitHub und prüft alle 20 Minuten automatisch die Bestände."

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bibliotheken installieren
        run: pip install requests beautifulsoup4

      - name: Tracker ausführen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tracker.py

      - name: Gesehene Angebote speichern
        run: |
          git config user.name "TrackerBot"
          git config user.email "bot@example.com"
          git add seen_offers.json || true
          git diff --staged --quiet || git commit -m "Update seen offers"
          git push
